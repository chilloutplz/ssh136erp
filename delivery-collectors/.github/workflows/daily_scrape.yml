name: Daily Matepos Scraping

on:
  # schedule:
    # 한국 시간(KST) 오전 9시는 UTC 기준 00:00입니다.
    # 한국 시간(KST) 오전 7시에 실행되도록
    # - cron: '0 22 * * *'
  workflow_dispatch: # 수동 실행 버튼 활성화

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Get Yesterday Date
        id: date
        run: |
          # 한국 시간(KST, UTC+9) 기준으로 전일 날짜 계산
          echo "yesterday=$(TZ=Asia/Seoul date -d 'yesterday' +%Y%m%d)" >> $GITHUB_OUTPUT

      - name: Run Scraper
        env:
          # GitHub Secrets에 등록한 값들을 환경변수로 매핑
          MATEPOS_USER_ID: ${{ secrets.MATEPOS_USER_ID }}
          MATEPOS_PASSWORD: ${{ secrets.MATEPOS_PASSWORD }}
          HQ_BRAND_ID: ${{ secrets.HQ_BRAND_ID }}
          MS_STR_ID: ${{ secrets.MS_STR_ID }}
          STORE_NAME: ${{ secrets.STORE_NAME }}
          enpCd: ${{ secrets.ENPCD }}
          corpCd: ${{ secrets.CORPCD }}
          brandCd: ${{ secrets.BRANDCD }}
          DJANGO_URL: ${{ secrets.DJANGO_URL }}
          #  디스코드 웹후크 URL 추가
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          # 계산된 전일 날짜를 --start와 --end에 주입
          python run.py --scraper matepos --start ${{ steps.date.outputs.yesterday }} --end ${{ steps.date.outputs.yesterday }}